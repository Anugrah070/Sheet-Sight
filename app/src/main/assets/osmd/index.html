<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
    <title>Sheet Sight score</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background: #eceae5;
            overscroll-behavior: contain;
        }
        body { padding: 12px; }
        #score {
            width: 100%;
            min-height: calc(100vh - 24px);
            margin: 0 auto;
            padding: 10px 14px 18px;
            overflow: hidden;
            background: #fffefa;
            border-radius: 6px;
            box-shadow: 0 2px 10px rgba(25, 25, 25, 0.13);
        }
        #score svg { display: block; }
        #error {
            display: none;
            max-width: 720px;
            margin: 72px auto;
            padding: 20px;
            color: #6f1d1b;
            background: #fff1f0;
            border-radius: 8px;
            font: 16px/1.45 sans-serif;
        }
    </style>
</head>
<body>
<main id="score" aria-label="Rendered sheet music"></main>
<div id="error" role="alert"></div>
<script src="opensheetmusicdisplay.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
